# Nginx reverse proxy for the rescue-system app running in Docker on :5000.
# Usage: copy to /etc/nginx/sites-available/frt-rescue, edit YOUR_DOMAIN,
# symlink into sites-enabled, then run certbot (see README "النشر على
# Oracle Cloud" section) — certbot will edit this file automatically to
# add the HTTPS block, so you don't need to write that part by hand.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded documents/photos can be sizeable — match the app's own limits.
    client_max_body_size 20M;
}
